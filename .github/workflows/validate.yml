name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.json > /dev/null

      - name: Validate shell scripts
        run: bash -n bin/*.sh

      - name: Install QML formatter
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt6-declarative-dev-tools
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Parse QML files
        run: find . -name '*.qml' -print0 | xargs -0 -r -n1 qmlformat > /dev/null
